    bias: "-0.44 V"
    lead: "0.04 s"
    lag: "0.2 s"
    gain: "564.0 mA/V"
    offset: "-31.0 mA"
    dead_band: "2.0 mA"
    sensitivity: "0.0159 in/(mA*s)"
    stops: {lower: "-0.0427 in", upper: "0.0787 in"}
    feedback: "55.0 V/in"
    linkage: "84.0 lbm*in^2/(lbf*hr*in)"
  ps3_sensor: {lag: "0.01 s", hysteresis: "0.375 psi"}
  load_demand: {rigging_gain: "0.914 deg/%", rigging_bias: "5.34 deg", hysteresis: "2.5 deg", fuel_bias: "3.26 lbm*in^2/(lbf*hr)", lag: "0.2 s"}  # Figs. C12, C13, C17
  droop: {slope: "0.25 lbm*in^2/(lbf*hr*%)", reference: "101.0 %"}
  ng_sensor: {hysteresis: "0.05 %", lag: "0.025 s"}
  # The power lever's rigging to the spindle, linear between its stops (D-055 item 2): fly at
