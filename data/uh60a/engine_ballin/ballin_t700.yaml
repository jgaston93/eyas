  power_available: {idle: !placeholder "28.524 deg", fly: "120.0 deg"}
  deceleration: {gain: "0.05909 lbm*in^2/(lbf*hr*%)", bias: "-3.927 lbm*in^2/(lbf*hr)", lower: "1.45 lbm*in^2/(lbf*hr)", upper: "2.1 lbm*in^2/(lbf*hr)"}
  valve: {min: "65.0 lbm/hr", max: "785.0 lbm/hr", lag: "0.03 s", delay: "0.015 s"}  # Fig. C19
  hysteresis_lag: "0.005 s"  # D-054 item 7
