      area: "45.0 ft^2"
      incidence_input: fcs  # GenHel Fig. 5.1.7, dynamic (D-045)
      coefficients: ../airframe/stabilator_coefficients.csv
      q_ratio: ../airframe/stabilator_q_ratio.csv
      downwash: ../airframe/stabilator_downwash.csv
    fin:
