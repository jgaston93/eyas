# source: GenHel, NASA CR-166309 (1981): main rotor p. 5.1-49, tail rotor p. 5.4-14,
# fuselage p. 5.2-15, empennage p. 5.3-19, stabilator Fig. 5.1.7, control rigging
# Figs. 5.1.6(a)-(d) and p. 5.5-20, landing gear pp. 5.7-40 to 5.7-47, mass properties,
# gyroscopic components and downwash correction terms p. 5.10-19; transcriptions in
# data/uh60a/genhel/.
# Generated by tools/build_uh60a_config.py; edit the transcriptions or the script, not this file.
#
# Mass split (DECISIONS.md D-002, D-034): GenHel's WEIGHT 15600.0 lbm and CG
# (FS 351.4, BL 0, WL 231.9 in) are the whole aircraft's. The airframe
# below excludes the four blades (main rotor) and the three unsprung masses (gear); its CG is at
# FS 352.1184, BL 0, WL 226.6355 in, the origin of every position here.
# Positions: x = -(FS - FS_cg), y = -(BL - BL_cg) (buttlines positive to port), z = -(WL - WL_cg).
#
# Controls (D-034, D-035): stick and pedal travels from GenHel Figs. 6.3.1 and 6.4.1 (pp. 6.16-6.17):
#   collective 0..10.0 in, lat_cyclic 0..10.0 in, lon_cyclic -3.0885..6.9115 in, pedal 0..5.38 in.
# Collective, lateral and pedal fit the rigging exactly; the pedal uses its stroke with overtravel.
# The longitudinal rows put neutral cyclic in three places 0.812 in apart; neutral is the
# pinned row's, the end nearest the fit to Ballin's GenHel longitudinal stick (D-035 M7c amendment).
#
# Validation variant (ballin_app_d/uh60a_file512.yaml): WEIGHT and CG from Ballin, NASA TM-88360 (1987), Table C1 (p. 37), file 512 (Fig. D10): gross weight 15600 lbm, CG station 351.4 in, CG waterline 231.9 in; CG buttline 0 (App. C).
# Inertias are GenHel's (D-002); not for use as the aircraft's own data.

geodetic_origin: {latitude: "0 deg", longitude: "0 deg", altitude: "0 m"}  # scenario, not aircraft data

airframe:
  mass: "14368.365054 lbm"
  inertia: {ixx: "4659.0 slug*ft^2", iyy: "38512.0 slug*ft^2", izz: "36796.0 slug*ft^2", ixz: "1882.0 slug*ft^2"}

components:
  # Producers before consumers is the executive's job (D-003); config order is for reading.
  - type: genhel_fcs
    name: fcs
    rigging:  # Figs. 5.1.6(a)-(d), p. 5.5-20; control_rigging_5_5.txt
      travel: {collective: {lo: "0 in", hi: "10.0 in"}, lat_cyclic: {lo: "0 in", hi: "10.0 in"}, lon_cyclic: {lo: "-3.088530035 in", hi: "6.911469965 in"}, pedal: {lo: "1.6248e-05 in", hi: "5.380016248 in"}}
      gains: {collective: "1.6 deg/in", lateral: "1.6 deg/in", longitudinal: "-2.83 deg/in", pedal: "-5.539 deg/in"}
      longitudinal_stick_sign: -1.0
      mixing: {lateral_collective: -0.16, longitudinal_collective: 0.29, longitudinal_pedal: -0.2936}
      bias: {collective: "9.9 deg", lateral: "-8.0 deg", longitudinal: "-9.7754 deg", pedal: "21.9 deg"}
      swashplate_phase: "-9.7 deg"
    primary_servo: {a2: "0.00114 s^2", a1: "0.0473 s"}
    rate_gyro: {a2: "0.00014 s^2", a1: "0.016 s"}  # Fig. 5.1.2
    lateral_accelerometer:
      a2: "0.0254 s^2"
      a1: "0.233 s"
      position: {x: "45.118438 in", y: "0 in", z: "-36.364478 in"}  # p. 5.10-19
    stabilator:  # Fig. 5.1.7; fig_5_5_1_7_stabilator.txt
      schedule: {table: ../airframe/stabilator_schedule.csv, min: "-8.0 deg", max: "39.0 deg"}
      airspeed_lag: "0.398 s"
      pitch_rate_gain: "0.16 s"  # deg per deg/s
      lateral_accel_gain: {gain: "-1.299 deg/(ft/s^2)", from: "30.0 kt", to: "60.0 kt"}
      servo: {a2: "0.0254 s^2", a1: "0.223 s", rate_limit: "7.0 deg/s"}
    sas:  # Figs. 5.1.3(a)-(c), pp. 5.5-2, 5.5-7 to 5.5-9; fig_5_1_3_sas.txt (M8c2)
      hold: "0.025 s"  # digital zero-order hold, "airborne computer update delay"
      switch_speed: "60.0 kt"
      fade_time: "2.0 s"
      actuator: {a2: "0.00032 s^2", a1: "0.025 s"}
      descaling: {pitch: "-0.283 deg/%", roll: "0.16 deg/%", yaw: "-0.298 deg/%"}  # p. 5.5-20
      pitch:
        digital: {ad_lag: "0.026 s", rate: {gain: "-0.5425 %/(deg/s)", lag: "0.023 s"}, lagged_rate: {gain: "-0.541 %/(deg/s)", lag: "2.0 s"}, washout: "7.0 s", limit: "5.0 %"}
        analog: {filter: {gain: 0.1785, lag: "0.022 s"}, washout: "7.0 s", rate: {gain: "-6.194 %/(deg/s)", lag: "0.024 s"}, lagged_rate: {gain: "-6.047 %/(deg/s)", lag: "1.993 s"}, scale: 0.5, limit: "5.5 %"}
      roll:
        digital: {ad_lag: "0.026 s", rate_gain: "-0.2085 %/(deg/s)", lagged_rate: {gain: "-0.1035 %/(deg/s)", lag: "1.02 s"}, attitude: {gain: "-0.139 %/deg", limit: "7.0 deg"}, limit: "5.0 %"}
        analog:
          attitude_filter: {gain: 0.0885, lag1: "0.0058 s", lag2: "0.00154 s"}
          shaping: {gain: 1.06, a2: "0.00203 s^2", a1: "0.0655 s", limit: "75.0 deg"}
          derivative: {gain: 1.24, lag1: "0.0091 s", lag2: "0.00195 s"}
          rate: {gain: "-1.738 %/(deg/s)", lag: "0.0112 s"}
          lagged_rate: {gain: "-0.847 %/(deg/s)", lag: "0.996 s"}
          attitude: {gain: -0.703, limit: "7.0 deg", output_gain: "2.413 %/deg"}
          limit: "5.5 %"
      yaw:
        digital: {ad_lag: "0.026 s", rate: {gain: "-0.557 %/(deg/s)", lag: "0.047 s"}, lagged_rate: {gain: "-0.901 %/(deg/s)", lag: "1.0 s"}, washout: "2.0 s", lateral_accel: {gain: "-1.1 %/(ft/s^2)", lag: "1.0 s"}, roll_rate_gain: "0.1378 %/(deg/s)", limit: "5.0 %"}
        analog:
          filter: {gain: 0.072, lag: "0.027 s"}
          washout: "2.0 s"
          rate: {gain: "-16.95 %/(deg/s)", lag: "0.047 s"}
          lateral_accel_gain: "0.0876 (deg/s)/(ft/s^2)"  # KLAYF1; its 0.0001 s lag is unity (p. 5.5-2)
          lagged: {gain: "-28.11 %/(deg/s)", lag: "1.045 s"}
          scale: 0.5
          roll_rate_gain: 0.296  # on the roll analog rate path's output ("B"; DATA_GAPS.md)
          limit: "5.5 %"
    pitch_bias:  # Fig. 5.1.4, pp. 5.5-2, 5.5-3, 5.5-10; fig_5_1_4_pba.txt (M8c2)
      attitude: {gain: "-0.375 %/deg", limit: "20.0 deg"}
      pitch_rate: {gain: "-0.13125 %/(deg/s)", limit: "34.5 deg/s"}  # on the pitch SAS's A/D output
      airspeed: {gain: "0.0525 %/kt", from: "80.0 kt", range: "100.0 kt"}
      bias: "-4.9 %"
      hold: "0.1 s"
      actuator: {gain: "10.0 1/s", rate_limit: "3.0 %/s", authority: "15.0 %"}
    fps:  # Figs. 5.1.5(a)-(c), pp. 5.5-3, 5.5-11 to 5.5-13; fig_5_1_5_fps.txt (M8c3)
      hold: "0.1 s"  # zero-order hold, "airborne computer update delay"
      trim_actuator: {gain: "24.1 1/s", rate_limit: "10.0 %/s", authority: "100.0 %"}
      pitch:
        rate_gain: "-0.336 %/(deg/s)"  # on the pitch SAS's A/D output
        attitude_gain: "-1.42 %/deg"
        airspeed: {gain: "0.22 %/kt", limit: "1.6 %", integral_gain: "0.0188 %/(kt*s)", hold_above: "30.0 kt"}
      roll:
        rate_gain: "-0.189 %/(deg/s)"  # on the roll SAS's A/D output
        attitude: {gain: "-0.75 %/deg", breakpoint: "7.9 deg", gain_beyond: "-0.375 %/deg"}
        integral_gain: "-0.0868 %/(deg*s)"
      yaw:
        heading: {gain: "-2.2 %/deg", integral_gain: "-0.348 %/(deg*s)", deadband: "1.0 deg"}
        lateral_accel: {lag: "1.0 s", gain: "-2.38 %/(ft/s^2)", integral_gain: "-0.656 %/(ft/s^2*s)"}
        roll_rate_gain: "0.11 %/(deg/s)"  # turn switch on
        collective: {gain: -0.625, airspeed_rate_limit: "10.0 kt/s", fade_from: "40.0 kt", fade_to: "100.0 kt"}  # %/%
        integrator_wiring: physical  # DATA_GAPS.md, "UH-60A AFCS"

  - type: blade_element_rotor
    name: main_rotor
    blades: 4
    radius: "26.83 ft"
    rotor_speed: "27.0 rad/s"
    direction: counter_clockwise
    inflow: pitt_peters
    vortex_ring: johnson_2005  # Johnson NASA/TP-2005-213477 (D-049)
    ground_effect: genhel  # GenHel CR-166309 Eq. 5.8.2-1 (D-050)
    inflow_tip_loss: none
    hub:
      position: {x: "10.918438 in", y: "0 in", z: "-88.364478 in"}
