        brake: right
        tire:
          radius: "12.65 in"
          wheels: 1
          pressure: "140.0 psi"
          rated_pressure: "110.0 psi"
          vertical_load: ../gear/main_tire_vertical.csv
          damping_stiffness: ../gear/main_tire_damping_stiffness.csv
          lateral_stiffness: ../gear/main_tire_lateral.csv
          fore_aft_coefficient: 0.53
          damping_factor: "0.003 s"
          damping_lag: "0.01 s"
        strut:
          preload: "3000.0 lbf"
          air_spring: "3465.0 ft*lbf"
          damper:
            break_speed: "1.4167 ft/s"
            low: {coefficient: "1382.4 lbf*s^2/ft^2", offset: "0 lbf"}
