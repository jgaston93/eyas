    hub:
      position: {x: "-379.881562 in", y: "14.0 in", z: "-98.064478 in"}
      roll: "70.0 deg"
    pitch_input: fcs
    main_rotor_wash: {rotor: main_rotor, table: ../airframe/tail_wash.csv}
    fuselage_wake: {airframe: airframe}

  - type: landing_gear
