# source: GenHel, NASA CR-166309 (1981): main rotor p. 5.1-49, tail rotor p. 5.4-14,
# fuselage p. 5.2-15, empennage p. 5.3-19, stabilator Fig. 5.1.7, control rigging
# Figs. 5.1.6(a)-(d) and p. 5.5-20, landing gear pp. 5.7-40 to 5.7-47, mass properties,
# gyroscopic components and downwash correction terms p. 5.10-19; transcriptions in
# data/uh60a/genhel/.
# Generated by tools/build_uh60a_config.py; edit the transcriptions or the script, not this file.
#
# Mass split (DECISIONS.md D-002, D-034): GenHel's WEIGHT 16170.0 lbm and CG
# (FS 350.4, BL 0, WL 231.8 in) are the whole aircraft's. The airframe
# below excludes the four blades (main rotor) and the three unsprung masses (gear); its CG is at
# FS 351.0086, BL 0, WL 226.7282 in, the origin of every position here.
# Positions: x = -(FS - FS_cg), y = -(BL - BL_cg) (buttlines positive to port), z = -(WL - WL_cg).
#
# Controls (D-034, D-035): stick and pedal travels from GenHel Figs. 6.3.1 and 6.4.1 (pp. 6.16-6.17):
#   collective 0..10.0 in, lat_cyclic 0..10.0 in, lon_cyclic -3.0885..6.9115 in, pedal 0..5.38 in.
# Collective, lateral and pedal fit the rigging exactly; the pedal uses its stroke with overtravel.
# The longitudinal rows put neutral cyclic in three places 0.812 in apart; neutral is the
# pinned row's, the end nearest the fit to Ballin's GenHel longitudinal stick (D-035 M7c amendment).
#
# Validation variant (kaplita/uh60a_kaplita_fig2_standin.yaml): WEIGHT and CG from Kaplita, NASA CR-177360 (1985), Fig. 2 header (PDF p. 51): gross weight 16170 lbm, CG station 350.4 in. STAND-IN: CG waterline 231.8 in, Kaplita Fig. 13's (flight 19), in place of Fig. 2's, which isn't given (DATA_GAPS.md); for comparison only, not a reading.
# Inertias are GenHel's (D-002); not for use as the aircraft's own data.

geodetic_origin: {latitude: "0 deg", longitude: "0 deg", altitude: "0 m"}  # scenario, not aircraft data

airframe:
  mass: "14938.365054 lbm"
  inertia: {ixx: "4659.0 slug*ft^2", iyy: "38512.0 slug*ft^2", izz: "36796.0 slug*ft^2", ixz: "1882.0 slug*ft^2"}

# Rotor speed (D-052, D-053): main and tail rotors geared on one shaft, driven by
# GenHel's T700 engines through their clutch (free drive). Its parts: GenHel's
# spinning parts geared to the drive (p. 5.10-19, D-048), turning with it, each
# as its own inertia at its speed; and the rest of J_REST ("downstream of clutch
# less blades", p. 5.6-23), referred to rotor speed, with no angular momentum:
# GenHel's gyroscopics are the p. 5.10-19 list alone (D-053 amendment 4).
shafts:
  - name: rotor_drive
    speed: "27.0 rad/s"
    parts:
      - {inertia: "0.082 slug*ft^2", speed: "609.0 rad/s", axis: {x: 1, y: 0, z: 0}}  # JXGY3, p. 5.10-19
      - {inertia: "0.715 slug*ft^2", speed: "127.1 rad/s", axis: {x: 0, y: 1, z: 0}}  # JYGY1, p. 5.10-19
      - {inertia: "18.0 slug*ft^2", speed: "-27.0 rad/s", axis: {x: 0, y: 0, z: 1}}  # JZGZ1, p. 5.10-19
      - {inertia: "868.338072 slug*ft^2"}  # J_REST less the parts above (943.9 - 75.5619), no momentum
    drive: free

components:
  # Producers before consumers is the executive's job (D-003); config order is for reading.
  - type: genhel_t700  # GenHel §5.6, pp. 5.6-8 to 5.6-28; engine_constants_5_6_5.txt (D-053)
    name: engines
    shaft: {name: rotor_drive}
    rotor: main_rotor  # reads main_rotor.shaft_torque, GenHel's Q_HMR
    engines: 2
    gear: 76.0216
    power_turbine_speed: "20000.0 rpm"
    gas_generator_speed: "44700.0 rpm"
    loss_factor: 0.1
    maps:
      torque: ../engine/t700_torque.csv
      lds_rigging: ../engine/t700_lds_rigging.csv
      lds_cam: ../engine/t700_lds_cam.csv
      fuel: ../engine/t700_fuel.csv
      p3: ../engine/t700_p3.csv
      partials: ../engine/t700_partials.csv
    ecu:  # Fig. 6.1.3, pp. 5.6-11 to 5.6-13
      k1: "3.0 V/%"
      k3: "0.6 V/%"
      k4: "0.059 V/(ft*lbf)"  # in no printed equation; Q_INT (D-053 item 2)
      k6: 0.2
      k9: "0.08 1/s"
      k10: "0.020408 s^2"
      k11: "0.1 s"
      dead_band: {a: "0.4 V", b: "0.8 V"}
      t1: "0.55 s"
      t2: "0.107 s"
      t3: "0.08 s"
      t4: "1.58 s"
      integrator_limits: {upper: "0 V", lower: "-3.5 V"}
      g4: "564.0 mA/V"
      g5: "0.0159 in/mA"
      g6: "56.0 V/in"
      g7: "336.0 %/in"
      T2: "0.2 s"
      T3: "0.04 s"
    switch: {speed_band: {low: "-4 %", high: "1 %"}, torque_gain: "0.7 1/s", threshold: "20 V", limit: "40 V"}  # p. 5.6-12
    fuel_control:  # pp. 5.6-14, 5.6-15
      speed_lag: "0.02 s"
      ratio_gain: "0.25 lbm/(hr*psi*%)"
      p3_lag: "0.01 s"
      valve_lag: "0.004 s"
    gas_generator: {acceleration: "0.479 %/(ft*lbf*s)", heat_sink: 0.65}
    clutch:  # Fig. 6.1.4, pp. 5.6-17, 5.6-18
      demand_lag: "0.3 s"
      drive_inertia: "7911.204351 slug*ft^2"  # J_REST + 4 (I_B + 2 E M_B + m E^2)
      engine_inertia: "690.6 slug*ft^2"  # J_TOTE
    power_turbine_spool: {axis: {x: 1, y: 0, z: 0}}  # JXGY2's axis (p. 5.10-19)
    gas_generator_spool: {inertia: "0.116 slug*ft^2", axis: {x: 1, y: 0, z: 0}}  # JXGY1

  - type: genhel_fcs
    name: fcs
    rigging:  # Figs. 5.1.6(a)-(d), p. 5.5-20; control_rigging_5_5.txt
      travel: {collective: {lo: "0 in", hi: "10.0 in"}, lat_cyclic: {lo: "0 in", hi: "10.0 in"}, lon_cyclic: {lo: "-3.088530035 in", hi: "6.911469965 in"}, pedal: {lo: "1.6248e-05 in", hi: "5.380016248 in"}}
      gains: {collective: "1.6 deg/in", lateral: "1.6 deg/in", longitudinal: "-2.83 deg/in", pedal: "-5.539 deg/in"}
      longitudinal_stick_sign: -1.0
      mixing: {lateral_collective: -0.16, longitudinal_collective: 0.29, longitudinal_pedal: -0.2936}
      bias: {collective: "9.9 deg", lateral: "-8.0 deg", longitudinal: "-9.7754 deg", pedal: "21.9 deg"}
      swashplate_phase: "-9.7 deg"
    primary_servo: {a2: "0.00114 s^2", a1: "0.0473 s"}
    rate_gyro: {a2: "0.00014 s^2", a1: "0.016 s"}  # Fig. 5.1.2
    lateral_accelerometer:
      a2: "0.0254 s^2"
      a1: "0.233 s"
      position: {x: "44.008577 in", y: "0 in", z: "-36.271848 in"}  # p. 5.10-19
    stabilator:  # Fig. 5.1.7; fig_5_5_1_7_stabilator.txt
      schedule: {table: ../airframe/stabilator_schedule.csv, min: "-8.0 deg", max: "39.0 deg"}
      airspeed_lag: "0.398 s"
      pitch_rate_gain: "0.16 s"  # deg per deg/s
      lateral_accel_gain: {gain: "-1.299 deg/(ft/s^2)", from: "30.0 kt", to: "60.0 kt"}
      servo: {a2: "0.0254 s^2", a1: "0.223 s", rate_limit: "7.0 deg/s"}
    sas:  # Figs. 5.1.3(a)-(c), pp. 5.5-2, 5.5-7 to 5.5-9; fig_5_1_3_sas.txt (M8c2)
      hold: "0.025 s"  # digital zero-order hold, "airborne computer update delay"
      switch_speed: "60.0 kt"
      fade_time: "2.0 s"
      actuator: {a2: "0.00032 s^2", a1: "0.025 s"}
      descaling: {pitch: "-0.283 deg/%", roll: "0.16 deg/%", yaw: "-0.298 deg/%"}  # p. 5.5-20
      pitch:
        digital: {ad_lag: "0.026 s", rate: {gain: "-0.5425 %/(deg/s)", lag: "0.023 s"}, lagged_rate: {gain: "-0.541 %/(deg/s)", lag: "2.0 s"}, washout: "7.0 s", limit: "5.0 %"}
        analog: {filter: {gain: 0.1785, lag: "0.022 s"}, washout: "7.0 s", rate: {gain: "-6.194 %/(deg/s)", lag: "0.024 s"}, lagged_rate: {gain: "-6.047 %/(deg/s)", lag: "1.993 s"}, scale: 0.5, limit: "5.5 %"}
      roll:
        digital: {ad_lag: "0.026 s", rate_gain: "-0.2085 %/(deg/s)", lagged_rate: {gain: "-0.1035 %/(deg/s)", lag: "1.02 s"}, attitude: {gain: "-0.139 %/deg", limit: "7.0 deg"}, limit: "5.0 %"}
        analog:
          attitude_filter: {gain: 0.0885, lag1: "0.0058 s", lag2: "0.00154 s"}
          shaping: {gain: 1.06, a2: "0.00203 s^2", a1: "0.0655 s", limit: "75.0 deg"}
          derivative: {gain: 1.24, lag1: "0.0091 s", lag2: "0.00195 s"}
          rate: {gain: "-1.738 %/(deg/s)", lag: "0.0112 s"}
          lagged_rate: {gain: "-0.847 %/(deg/s)", lag: "0.996 s"}
          attitude: {gain: -0.703, limit: "7.0 deg", output_gain: "2.413 %/deg"}
          limit: "5.5 %"
      yaw:
        digital: {ad_lag: "0.026 s", rate: {gain: "-0.557 %/(deg/s)", lag: "0.047 s"}, lagged_rate: {gain: "-0.901 %/(deg/s)", lag: "1.0 s"}, washout: "2.0 s", lateral_accel: {gain: "-1.1 %/(ft/s^2)", lag: "1.0 s"}, roll_rate_gain: "0.1378 %/(deg/s)", limit: "5.0 %"}
        analog:
          filter: {gain: 0.072, lag: "0.027 s"}
          washout: "2.0 s"
          rate: {gain: "-16.95 %/(deg/s)", lag: "0.047 s"}
          lateral_accel_gain: "0.0876 (deg/s)/(ft/s^2)"  # KLAYF1; its 0.0001 s lag is unity (p. 5.5-2)
          lagged: {gain: "-28.11 %/(deg/s)", lag: "1.045 s"}
          scale: 0.5
          roll_rate_gain: 0.296  # on the roll analog rate path's output ("B"; DATA_GAPS.md)
          limit: "5.5 %"
    pitch_bias:  # Fig. 5.1.4, pp. 5.5-2, 5.5-3, 5.5-10; fig_5_1_4_pba.txt (M8c2)
      attitude: {gain: "-0.375 %/deg", limit: "20.0 deg"}
      pitch_rate: {gain: "-0.13125 %/(deg/s)", limit: "34.5 deg/s"}  # on the pitch SAS's A/D output
      airspeed: {gain: "0.0525 %/kt", from: "80.0 kt", range: "100.0 kt"}
      bias: "-4.9 %"
      hold: "0.1 s"
      actuator: {gain: "10.0 1/s", rate_limit: "3.0 %/s", authority: "15.0 %"}
    fps:  # Figs. 5.1.5(a)-(c), pp. 5.5-3, 5.5-11 to 5.5-13; fig_5_1_5_fps.txt (M8c3)
      hold: "0.1 s"  # zero-order hold, "airborne computer update delay"
      trim_actuator: {gain: "24.1 1/s", rate_limit: "10.0 %/s", authority: "100.0 %"}
      pitch:
        rate_gain: "-0.336 %/(deg/s)"  # on the pitch SAS's A/D output
        attitude_gain: "-1.42 %/deg"
        airspeed: {gain: "0.22 %/kt", limit: "1.6 %", integral_gain: "0.0188 %/(kt*s)", hold_above: "30.0 kt"}
      roll:
        rate_gain: "-0.189 %/(deg/s)"  # on the roll SAS's A/D output
        attitude: {gain: "-0.75 %/deg", breakpoint: "7.9 deg", gain_beyond: "-0.375 %/deg"}
        integral_gain: "-0.0868 %/(deg*s)"
      yaw:
        heading: {gain: "-2.2 %/deg", integral_gain: "-0.348 %/(deg*s)", deadband: "1.0 deg"}
        lateral_accel: {lag: "1.0 s", gain: "-2.38 %/(ft/s^2)", integral_gain: "-0.656 %/(ft/s^2*s)"}
        roll_rate_gain: "0.11 %/(deg/s)"  # turn switch on
        collective: {gain: -0.625, airspeed_rate_limit: "10.0 kt/s", fade_from: "40.0 kt", fade_to: "100.0 kt"}  # %/%
        integrator_wiring: physical  # DATA_GAPS.md, "UH-60A AFCS"

  - type: blade_element_rotor
    name: main_rotor
    blades: 4
    radius: "26.83 ft"
    rotor_speed: "27.0 rad/s"
    direction: counter_clockwise
    inflow: pitt_peters
    vortex_ring: johnson_2005  # Johnson NASA/TP-2005-213477 (D-049)
    ground_effect: genhel  # GenHel CR-166309 Eq. 5.8.2-1 (D-050)
    shaft: {name: rotor_drive}  # D-052
    inflow_tip_loss: effective_disc  # Johnson 2013 §3.6.2 (D-051)
    hub:
      position: {x: "9.808577 in", y: "0 in", z: "-88.271848 in"}
      pitch: "-3.0 deg"
      roll: "0 deg"
    blade:
      root_cutout: "5.08 ft"
      tip_loss: 0.97
      chord: "1.73 ft"
      twist_table: ../twist.csv
      airfoil: ../sc1095.csv
      elements: 20
      flap:
        hinge_offset: "1.25 ft"
        mass: "256.9 lbm"
        first_moment: "86.7 slug*ft"
        inertia: "1512.6 slug*ft^2"
        delta3: "0 deg"
      dynamic_twist: {gain_table: ../dynamic_twist_gain.csv, mode_table: ../dynamic_twist_mode.csv, lag: "0.01 s"}  # D-038; lag numerical
      yawed_flow_drag: true  # D-039 (GenHel resolves its drag on the full segment velocity, p. 5.1-28)
    pitch_input: fcs  # GenHel's mixer, primary servos and head limits (D-045)

  - type: airframe_aero
    name: airframe
    fuselage:
      mounting_point: {x: "5.508577 in", y: "0 in", z: "-7.271848 in"}
      alpha_table: ../airframe/fuselage_alpha.csv
      psi_table: ../airframe/fuselage_psi.csv
      psi_low_table: ../airframe/fuselage_psi_low.csv
      main_rotor_wash: {rotor: main_rotor, table: ../airframe/fuselage_wash.csv}
    tail_wash: {rotor: main_rotor, table: ../airframe/tail_wash.csv}
    stabilator:
      position: {x: "-349.091423 in", y: "0 in", z: "-17.271848 in"}
      area: "45.0 ft^2"
      incidence_input: fcs  # GenHel Fig. 5.1.7, dynamic (D-045)
      coefficients: ../airframe/stabilator_coefficients.csv
      q_ratio: ../airframe/stabilator_q_ratio.csv
      downwash: ../airframe/stabilator_downwash.csv
    fin:
      position: {x: "-343.991423 in", y: "0 in", z: "-46.271848 in"}
      area: "32.3 ft^2"
      incidence: "0 deg"
      coefficients: ../airframe/fin_coefficients.csv
      q_ratio: ../airframe/fin_q_ratio.csv
      sidewash: ../airframe/fin_sidewash.csv
    additional_loads: ../airframe/motion_additions.csv  # p. 5.10-19 downwash correction terms (D-048)

  - type: bailey_rotor
    name: tail_rotor
    blades: 4
    radius: "5.5 ft"
    rotor_speed: "124.62 rad/s"
    shaft: {name: rotor_drive, gear: 4.615555555555556}  # tail/main speed (D-052)
    chord: "0.81 ft"
    lift_slope: "5.73 1/rad"
    tip_loss: 0.92
    twist: "-18.0 deg"
    delta3: "35.0 deg"
    coning_per_thrust: "0.001455 deg/lbf"
    pitch_bias: "6.0 deg"
    drag_area: "0 ft^2"
    blockage: {factor: 0.796, speed: "30.0 kt"}
    hub:
      position: {x: "-380.991423 in", y: "14.0 in", z: "-97.971848 in"}
      roll: "70.0 deg"
    pitch_input: fcs
    main_rotor_wash: {rotor: main_rotor, table: ../airframe/tail_wash.csv}
    fuselage_wake: {airframe: airframe}

  - type: landing_gear
    name: gear
    friction:
      coefficient: 0.6
      brake_factor_set: 1.0
      brake_factor_off: 0.01
      sliding_factor: 0.85
    gears:
      - name: left_main
        axle: {x: "53.578577 in", y: "-53.2 in", z: "41.928152 in"}
        unsprung_mass: "2.6708 slug"
        brake: left
        tire:
          radius: "12.65 in"
          wheels: 1
          pressure: "140.0 psi"
          rated_pressure: "110.0 psi"
          vertical_load: ../gear/main_tire_vertical.csv
          damping_stiffness: ../gear/main_tire_damping_stiffness.csv
          lateral_stiffness: ../gear/main_tire_lateral.csv
          fore_aft_coefficient: 0.53
          damping_factor: "0.003 s"
          damping_lag: "0.01 s"
        strut:
          preload: "3000.0 lbf"
          air_spring: "3465.0 ft*lbf"
          damper:
            break_speed: "1.4167 ft/s"
            low: {coefficient: "1382.4 lbf*s^2/ft^2", offset: "0 lbf"}
            high: {coefficient: "216.0 lbf*s^2/ft^2", offset: "2340.98 lbf"}
          stop_stiffness: !placeholder "43333.333 lbf/in"
