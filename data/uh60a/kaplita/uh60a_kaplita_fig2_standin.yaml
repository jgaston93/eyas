        unsprung_mass: "1.0 slug"
        brake: none
        tire:
          radius: "7.5 in"
          wheels: 1
          pressure: "90.0 psi"
          rated_pressure: "110.0 psi"
          vertical_load: ../gear/tail_tire_vertical.csv
          damping_stiffness: ../gear/tail_tire_damping_stiffness.csv
          lateral_stiffness_law: {reference_load: "1000.0 lbf", reference_stiffness: "622.9686990531707 lbf/in"}
          fore_aft_coefficient: 0.53
          damping_factor: "0.003 s"
          damping_lag: "0.01 s"
        strut:
          preload: "1251.0 lbf"
          air_spring: "2208.0 ft*lbf"
          damper:
            break_speed: "1 ft/s"
            low: {coefficient: "66.72 lbf*s^2/ft^2", offset: "0 lbf"}
            high: {coefficient: "66.72 lbf*s^2/ft^2", offset: "0 lbf"}
          stop_stiffness: !placeholder "19000.0 lbf/in"
          stop_damping: !placeholder "954.987 lbf*s/ft"
