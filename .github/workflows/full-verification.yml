name: Full verification

# The slow end of verification, off the per-push path (D-037 and its
# amendment of 2026-10-21): every test under the strict ASan+UBSan build
# (Debug, -Og, assertions on), split into four jobs, and with Clang (Debug),
# including the slow ones ci.yml runs on a PR in Release only; clang-tidy on
# every file; and every validation generator with its plots, uploaded as an
# artifact for comparison with docs/VALIDATION.md. Nightly on main, and on
# demand from the Actions tab. A failed scheduled run opens (or comments on)
# a GitHub issue.

on:
  schedule:
    - cron: "23 7 * * *"  # daily, 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Under the strict build the whole-aircraft trims take up to 2 h each
  # (BallinTrim.LevelFlightAgainstSikorskyGenHel: 7100 s), so the suite is
  # split four ways (ctest -I: every fourth test) and each part may use
  # GitHub's 6 h job limit. The gate on Ballin's engines (D-061) is left out:
  # about three times slower than the gate on GenHel's (an estimated 6 h
  # each), it runs in every PR's Release jobs and in the Clang job below, and
  # the engines' code it adds runs here in BallinT700Aircraft's trims.
  asan:
    name: Ubuntu GCC ASan+UBSan (strict), tests part ${{ matrix.part }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      ASAN_TOO_SLOW: ^(BallinTrim\.LevelFlightOnBallinsEngines|BallinTrim/ClimbOnEngines\..*)$
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libglfw3-dev libgl-dev
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-gcc-asan-${{ github.sha }}
          restore-keys: ccache-ubuntu-gcc-asan-
      - name: Configure
        run: >-
          cmake --preset asan
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset asan
      - name: Test (every fourth test, slow ones included)
        run: >-
          ctest --preset asan --parallel "$(nproc)" -I ${{ matrix.part }},,4
          --exclude-regex "$ASAN_TOO_SLOW"

  clang:
    name: Ubuntu Clang Debug, all tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libglfw3-dev libgl-dev
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-clang-debug-${{ github.sha }}
          restore-keys: ccache-ubuntu-clang-debug-
      - name: Configure
        run: >-
          cmake --preset debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset debug
      - name: Test (all, slow ones included)
        run: ctest --preset debug --parallel "$(nproc)"

  # About 1.5 h in all since the engine configs' trims (the Ballin engine
  # cases alone about 35 min); each generator's time is printed.
  validation:
    name: Validation generators and plots (Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libglfw3-dev libgl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the plotting tools
        run: pip install -r tools/requirements.txt
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-gcc-release-${{ github.sha }}
          restore-keys: ccache-ubuntu-gcc-release-
      - name: Configure
        run: >-
          cmake --preset release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset release
      # Each generator stops with an error if a case fails (an unconverged
      # trim, a bad config); the numbers themselves are compared with
      # VALIDATION.md by hand from the artifact.
      # Every generator runs even if one fails (a crash used to hide all the
      # ones after it); the step fails at the end, naming each failure.
      - name: Run every generator and plot
        run: |
          failed=""
          run() {  # name, generator, plot script
            echo "::group::$1"
            start=$SECONDS
            if "$2" "validation-output/data/$1" && python "$3" "validation-output/data/$1" "validation-output/plots/$1"; then
              echo "::endgroup::"
              echo "$1: $((SECONDS - start)) s"
            else
              echo "::endgroup::"
              echo "$1: $((SECONDS - start)) s"
              echo "::error::validation generator $1 failed"
              failed="$failed $1"
            fi
          }
          for m in m1 m2 m3 m4 m5 m6 m6c m6d m7 m7b m7c m8a m8c m8d m9_ground_effect; do
            run "$m" "./build/release/tests/eyas_${m}_cases" "tools/plot_${m}.py"
          done
          run m9_engines ./build/release/tests/eyas_m9_engine_cases tools/plot_m9_engines.py
          run m7c_fletcher ./build/release/tests/eyas_m7c_fletcher tools/plot_m7c_fletcher.py
          run m9_ballin ./build/release/tests/eyas_m9_ballin_engine_cases tools/plot_m9_ballin.py
          # Fletcher's yaw-to-collective on Ballin's engines (D-054).
          fletcher_ballin() { ./build/release/tests/eyas_m7c_fletcher "$1" data/uh60a/engine_ballin/uh60a_fletcher.yaml; }
          run m7c_fletcher_ballin fletcher_ballin tools/plot_m7c_fletcher.py
          # The same with the rotor shaft held, the engines kept: the M7 regression's baseline (#39).
          fletcher_ideal() { ./build/release/tests/eyas_m7c_fletcher "$1" data/uh60a/engine_ballin/uh60a_fletcher.yaml ideal; }
          run m7c_fletcher_ideal fletcher_ideal tools/plot_m7c_fletcher.py
          run ballin_app_d ./build/release/tests/eyas_ballin_app_d_cases tools/plot_ballin_app_d.py
          run kaplita ./build/release/tests/eyas_kaplita_cases tools/plot_kaplita.py
          run kaplita_transients ./build/release/tests/eyas_kaplita_transient_cases tools/plot_kaplita_transients.py
          # Data only, no generator: Knight & Hefner against the tip-loss readings (D-051).
          python tools/plot_m9_tip_loss.py validation-output/plots/m9_tip_loss || failed="$failed m9_tip_loss"
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-output-${{ github.sha }}
          path: validation-output
          retention-days: 30

  tidy:
    name: clang-tidy, every file
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy-18 libglfw3-dev libgl-dev
      - name: Configure (for compile_commands.json)
        run: cmake --preset debug
      - name: clang-tidy
        run: |
          out=$(clang-tidy-18 -p build/debug --quiet src/util/*.cpp src/sim/*.cpp src/core/*.cpp src/env/*.cpp src/rotor/*.cpp src/airframe/*.cpp src/analysis/*.cpp src/control/*.cpp src/engine/*.cpp bench/*.cpp examples/*/*.cpp 2>&1 | grep -E "warning:|error:" || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  # A failed scheduled run opens an issue, or comments on the open one, so
  # it can't go unnoticed (it once failed three nights running unseen). A
  # job past its time limit ends cancelled, not failed, and failure() misses
  # it (the generators timed out every night from 2026-10-24, unseen), so
  # the needed jobs' results are read instead.
  report:
    name: Report a failed nightly run
    needs: [asan, clang, validation, tidy]
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly full verification is failing"
          body="Run: $RUN_URL ($(date -u +%Y-%m-%d))"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again. $body"
          else
            gh issue create --title "$title" --label ci --body "$body"
          fi
