name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The slow tests: every test over about 1 s in Release (whole-aircraft
  # trims, linearizations and flights, long runs, the station's start points;
  # 49 tests, 317 of the suite's 332 s). On a PR they run in the Release
  # jobs only (GCC and Rocky); the Debug, Clang and ASan jobs skip them, as
  # those builds are 3-60x slower and look for memory, UB and assertion
  # faults that the fast tests reach through the same code. The nightly
  # full-verification.yml runs every test under the strict ASan build (Debug,
  # -Og) and Clang. Add a test here if it takes more than about 1 s in Release.
  SLOW_TESTS: ^(BallinTrim[./].*|BallinT700Aircraft\..*|BallinT700\.LoadShareBringsTheEnginesTogether|KaplitaSideslip\..*|Uh60aFps\..*|Uh60aVortexRing\..*|Uh60aGroundEffect\..*|Station(Starts|RealTime|Recorder)\..*|ExampleStation\..*|Linearize\.(PeriodicModelMatchesTheNonlinearResponse|HoverRateDerivativesMatchPadfield|GravityAndKinematicEntriesAreExact|SymmetricHoverIsConstantCoefficient|FeedNothingStatesSplitTheEigenvalues|HoverHeaveDampingMatchesPadfield)|Trim\.(Uh60aTrimsFromHoverTo150Knots|ControlsStayInTheirTravel|SasAndPbaMoveOnlyTheStick|SasDampsTheDutchRoll|Uh60aFliesOnFromTrim|FcsKickDiesOut|IndependentOfTheIntegrationStep|IndependentOfHeadingAndSteadyWind|FcsStartTransientIsSmall)|TrimAtRoll\.(InvertsTheSideslipTrim|ZeroRollIsReached)|RealTime\.(HeldOrbitRepeatsFor60s|ParkedAircraftSettlesFor60s|AfcsFreeFlightFor60s|HostRateDecoupling|JitteredHostRate)|FlapAnchors\.(HoverConingMatchesJohnson|CyclicStepPhaseLag|CentreSpringFlappingMatchesPadfield|OffsetHingeFlappingMatchesJohnson)|Executive\.OneHourAtSixtyHzGivesExactStepCount|Bench\.Smoke|Readouts\.(MatchTheComponentsOwnQueriesInFlight|EnginesDeliverWhatTheDriveTakesInTrim|AnEngineOutReadsOut)|DynamicTwist\.Uh60aTrimIsGenHelsFixedPointAndIndependentOfTheLag)$

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.compiler }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cc: gcc, cxx: g++, preset: debug }
          - { compiler: gcc, cc: gcc, cxx: g++, preset: release }
          # ASan+UBSan at -O1, assertions on: about 2.5x faster than the
          # strict -Og build the nightly runs (D-037 amendment 2026-10-21).
          - { compiler: gcc, cc: gcc, cxx: g++, preset: asan-fast }
          - { compiler: clang, cc: clang, cxx: clang++, preset: debug }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libglfw3-dev libgl-dev
      # Compiled objects (ours and the FetchContent dependencies) are reused
      # between runs; ccache only reuses an object when the compiler, flags
      # and preprocessed source match, so results are unchanged.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-ubuntu-${{ matrix.compiler }}-${{ matrix.preset }}-
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # Release runs every test; Debug, Clang and ASan skip the slow ones
      # (SLOW_TESTS above), which full-verification.yml runs nightly and
      # on demand.
      - name: Test
        run: >-
          ctest --preset ${{ matrix.preset }} --parallel "$(nproc)"
          ${{ matrix.preset != 'release' && format('--exclude-regex "{0}"', env.SLOW_TESTS) || '' }}
      - name: Compiler cache statistics
        run: ccache --show-stats

  # Target platform (DECISIONS D-037): Eyas and its host run in a RHEL 9
  # container, checked here in Rocky Linux 9 with its system GCC 11.
  rhel9:
    name: Rocky Linux 9 (system GCC 11) release
    runs-on: ubuntu-24.04
    container: rockylinux:9
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Install toolchain
        run: |
          dnf -y install gcc-c++ cmake git dnf-plugins-core tar zstd epel-release
          dnf config-manager --set-enabled crb
          dnf -y install ninja-build ccache glfw-devel mesa-libGL-devel
      - uses: actions/checkout@v5
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-rocky9-release-${{ github.sha }}
          restore-keys: ccache-rocky9-release-
      - name: Configure
        run: >-
          cmake --preset release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release --parallel "$(nproc)"
      - name: Compiler cache statistics
        run: ccache --show-stats

  lint:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the PR's base, for the changed files
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-format-18 clang-tidy-18 libglfw3-dev libgl-dev
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: Generated UH-60A tables and config match their transcriptions
        run: |
          python3 tools/build_uh60a_blade.py --check
          python3 tools/build_uh60a_airframe.py --check
          python3 tools/build_uh60a_gear.py --check
          python3 tools/build_uh60a_config.py --check
          python3 tools/build_fg_station_files.py --check
      - name: Configure (for compile_commands.json)
        run: cmake --preset debug
      # On a PR: the .cpp files it changes, and the .cpp beside each header
      # it changes (foo.hpp -> foo.cpp). A header change seen only through
      # other files waits for the nightly full run (full-verification.yml).
      # On a push to main: every file.
      - name: clang-tidy
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          all=$(ls src/util/*.cpp src/sim/*.cpp src/core/*.cpp src/env/*.cpp src/rotor/*.cpp src/airframe/*.cpp src/analysis/*.cpp src/control/*.cpp src/engine/*.cpp bench/*.cpp examples/*/*.cpp)
          if [ -n "$BASE_REF" ]; then
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD" | sed -e 's/\.hpp$/.cpp/' | sort -u)
            files=$(comm -12 <(echo "$all" | sort) <(echo "$changed"))
          else
            files=$all
          fi
          if [ -z "$files" ]; then echo "no C++ files to check"; exit 0; fi
          echo "$files"
          out=$(clang-tidy-18 -p build/debug --quiet $files 2>&1 | grep -E "warning:|error:" || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
