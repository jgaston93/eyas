name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Tests too slow to run under ASan on every push (also in full-verification.yml).
  SLOW_TESTS: ^(Linearize\.(PeriodicModelMatchesTheNonlinearResponse|HoverRateDerivativesMatchPadfield)|BallinTrim\..*|Trim\.(Uh60aTrimsFromHoverTo150Knots|SasAndPbaMoveOnlyTheStick|SasDampsTheDutchRoll)|Uh60aFps\..*|RealTime\.(HeldOrbitRepeatsFor60s|ParkedAircraftSettlesFor60s|AfcsFreeFlightFor60s)|Station(Starts|RealTime|Recorder)\..*|ExampleStation\..*)$

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.compiler }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cc: gcc, cxx: g++, preset: debug }
          - { compiler: gcc, cc: gcc, cxx: g++, preset: release }
          - { compiler: gcc, cc: gcc, cxx: g++, preset: asan }
          - { compiler: clang, cc: clang, cxx: clang++, preset: debug }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libglfw3-dev libgl-dev
      # Compiled objects (ours and the FetchContent dependencies) are reused
      # between runs; ccache only reuses an object when the compiler, flags
      # and preprocessed source match, so results are unchanged.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-ubuntu-${{ matrix.compiler }}-${{ matrix.preset }}-
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # The ASan build skips the slowest tests (sanitizers slow them about
      # 60x); full-verification.yml runs them under ASan nightly and on
      # demand. Every other job runs them on every push.
      - name: Test
        run: >-
          ctest --preset ${{ matrix.preset }} --parallel "$(nproc)"
          ${{ matrix.preset == 'asan' && format('--exclude-regex "{0}"', env.SLOW_TESTS) || '' }}
      - name: Compiler cache statistics
        run: ccache --show-stats

  # Target platform (DECISIONS D-037): Eyas and its host run in a RHEL 9
  # container, checked here in Rocky Linux 9 with its system GCC 11.
  rhel9:
    name: Rocky Linux 9 (system GCC 11) release
    runs-on: ubuntu-24.04
    container: rockylinux:9
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Install toolchain
        run: |
          dnf -y install gcc-c++ cmake git dnf-plugins-core tar zstd epel-release
          dnf config-manager --set-enabled crb
          dnf -y install ninja-build ccache glfw-devel mesa-libGL-devel
      - uses: actions/checkout@v5
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-rocky9-release-${{ github.sha }}
          restore-keys: ccache-rocky9-release-
      - name: Configure
        run: >-
          cmake --preset release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release --parallel "$(nproc)"
      - name: Compiler cache statistics
        run: ccache --show-stats

  lint:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-format-18 clang-tidy-18 libglfw3-dev libgl-dev
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: Generated UH-60A tables and config match their transcriptions
        run: |
          python3 tools/build_uh60a_blade.py --check
          python3 tools/build_uh60a_airframe.py --check
          python3 tools/build_uh60a_gear.py --check
          python3 tools/build_uh60a_config.py --check
          python3 tools/build_fg_station_files.py --check
      - name: Configure (for compile_commands.json)
        run: cmake --preset debug
      - name: clang-tidy
        run: |
          out=$(clang-tidy-18 -p build/debug --quiet src/util/*.cpp src/sim/*.cpp src/core/*.cpp src/env/*.cpp src/rotor/*.cpp src/airframe/*.cpp src/analysis/*.cpp src/control/*.cpp bench/*.cpp examples/*/*.cpp 2>&1 | grep -E "warning:|error:" || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
